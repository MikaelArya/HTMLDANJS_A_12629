<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Form - 12111</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <ul class="menu">
      <li><a href="HtmlCssBasic_A_12629.html">Kembali ke Halaman Utama</a></li>
      <li><a href="JSBasic_A_12629.html">Halaman Javascript</a></li>
  </ul>

  <h2>Form Pendaftaran Mahasiswa</h2>

  <form onsubmit="return validateForm()">
    <table cellspacing="4" cellpadding="4">
      <tr>
        <td><strong>Nama Mahasiswa</strong></td>
        <td><input type="text" id="namamhs" name="namamhs" required maxlength="30"></td>
      </tr> <!-- TODO: Tambahkan field input teks untuk Nama Mahasiswa dengan tipe teks dan WAJIB DIISI. -->

      <tr>
        <td><strong>Jenis Kelamin</strong></td>
        <td>
          <input type="radio" id="male" name="gender" value="male">
          <label for="male">Laki-laki</label>

          <input type="radio" id="female" name="gender" value="female">
          <label for="female">Perempuan</label>
        </td>
      </tr> <!-- TODO: Tambahkan field radio button untuk Jenis Kelamin (Laki-laki dan Perempuan) dan WAJIB DIISI -->
      
      <tr>
        <td><strong>Pilih Prodi</strong></td>
        <td>
          <select name="prodi" id="prodi" required>
            <option value="informatika">Informatika</option>
            <option value="teknik industri">Teknik Industri</option>
            <option value="sistem informasi">Sistem Informasi</option>
          </select>
        </td>
      </tr><!-- TODO: Tambahkan dropdown untuk Program Studi dengan id="prodi", 
           opsi: "Pilih Prodi", "Informatika", "Teknik Industri", "Sistem Informasi" dan WAJIB DIISI. -->

      <tr>
        <td><strong>Nomor Telepon</strong></td>
        <td><input type="number" id="notelp" name="notelp" required maxlength="15"></td>
      </tr><!-- TODO: Tambahkan field input angka untuk Nomor Telepon dengan tipe number dan WAJIB DIISI. -->

      <tr>
        <td><Strong>Tanggal Lahir</Strong></td>
        <td><input type="date" id="tgl" name="tgl" required></td>
      </tr><!-- TODO: Tambahkan field input tanggal untuk Tanggal Lahir dengan tipe date dan WAJIB DIISI. -->

      <tr>
        <td><strong>Email</strong></td>
        <td><input type="email" id="email" name="email" required maxlength="100"></td>
      </tr><!-- TODO: Tambahkan field input email dengan tipe email dan WAJIB DIISI. -->

      <tr>
        <td><strong>Password</strong></td>
        <td><input type="password" id="pw" name="pw" required minlength="8"></td>
      </tr><!-- TODO: Tambahkan field input password dengan tipe password dan WAJIB DIISI. -->

      <tr>
        <td><strong>Hal Favorit</strong></td>
        <td><fieldset>
          <legend>Game</legend>
          <input type="checkbox" id="game1" name="game" value="roblox">
          <label for="game1">Roblox</label><br>

          <input type="checkbox" id="game2" name="game" value="mc">
          <label for="game2">Magic Chess</label><br>

          <input type="checkbox" id="game3" name="game" value="um">
          <label for="game3">Uma Musume "Pretty Derby"</label><br>

          <input type="checkbox" id="game4" name="game" value="ef">
          <label for="game4">E-Football</label><br>

          <input type="checkbox" id="game5" name="game" value="pubg">
          <label for="game5">PUBG</label><br>
        </fieldset></td><br>
      </tr>
      
      <tr>
        <td><strong></strong></td>
        <td><fieldset><legend>Film</legend>
          <input type="checkbox" id="film1" name="film" value="drama">
          <label for="film1">Drama</label><br>

          <input type="checkbox" id="film2" name="film" value="action">
          <label for="film2">Action</label><br>

          <input type="checkbox" id="film3" name="film" value="romance">
          <label for="film3">Romance</label><br>

          <input type="checkbox" id="film4" name="film" value="comedy">
          <label for="film4">Comedy</label><br>

          <input type="checkbox" id="film5" name="film" value="horror">
          <label for="film5">Horror</label><br>
        </fieldset></td>
      </tr><!-- TODO: Tambahkan fieldset untuk Hal Favorit, berisi:
           - Fieldset "Game" dengan checkbox untuk Roblox, Magic Chess, dan beberapa game lain yang ingin kamu tambahkan.
           - Fieldset "Film" dengan checkbox untuk Drama, Action, Romance, Comedy, Horror.
       -->
           
      <tr>
        <td><strong>Deskripsi</strong></td>
        <td><textarea name="deskripsi" id="deskripsi" rows="5" cols="40" required></textarea></td>
      </tr><!-- TODO: Tambahkan textarea untuk Deskripsi dengan id="deskripsi" dan WAJIB DIISI. -->

      <tr>
        <td><strong>Foto</strong></td>
        <td><input type="file" id="foto" name="foto" accept=".jpeg, .jpeg, .png"></td>
      </tr><!-- TODO: Tambahkan field input Foto dengan tipe file dan WAJIB DIISI. -->

      <th>
        <td><input type="submit" id="simpan" value="Simpan"></td>
      </th><!-- TODO: Tambahkan tombol submit dengan id="simpan" dan value="Simpan". -->

      <!-- Contoh Field input : 
            <tr>
              <td><strong>Nama Mahasiswa</strong></td>
              <td><input required type="text" id="namamhs" name="namamhs" size="30" /></td>
            </tr> 
      -->

    </table>
  </form>

  <script>
    const validateForm = () =>alert("Data Berhasil Disimpan !");
  </script>
</body>
</html>
